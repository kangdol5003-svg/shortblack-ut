.lbt-sh .warn{color:#e5483a;font-weight:700}
.lbt-units{border-top:1px solid #f2f2f2;padding:4px 0}

.lbt-u .ty.memo{background:#191919;color:#fff}

.lbt-memo{display:flex;gap:6px;padding:10px 14px;border-top:1px solid #eee;background:#fff;flex:none}

.lbt-task .done:hover{background:#18a752}

.lbt-u .ty.done{background:#1fbf5f;color:#fff}
.lbt-res{background:#fff;border:2px solid #1fbf5f;border-radius:14px;padding:14px;margin-bottom:12px}

.lbt-res .tt{margin-left:auto;font:700 18px ui-monospace,Menlo,monospace}

.lbt-res .g div{background:#f6f6f6;border-radius:8px;padding:6px}.lbt-res .g b{display:block;font-size:16px;color:#191919}
.lbt-res .g .bad b{color:#e5483a}
.lbt-res .fl{margin-top:10px;font-size:12px;color:#444;line-height:1.6}
.lbt-res .ln{margin-top:4px;font-size:12px;color:#666}

.lbt-tools .btn.send{background:#191919;color:#fff;border-color:#191919}

.lbt-tools .btn.send.fail{background:#e5483a;border-color:#e5483a}

</style>

<template id="lbapp"><link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500&display=swap" rel="stylesheet">
<style>
/* ───────── 롱블랙 모바일 V0 재현 — 실측 기반 스타일 (longblack_spec.md) ───────── */
:root{
  --ink:#191919; --ink2:#141414; --rb:#282828; --rb7:#444; --rb6:#666; --rb5:#999; --rb4:#c8c8c8; --rb3:#d9d9d9; --rb2:#e7e7e7; --rb1:#f2f2f2; --rb0:#f5f5f5;
  --K:#5962ff; --B:#d3b18d; --C:#9fe99e; --L:#ff5126; --N:#8dbcd7;
  --purple:#a48dff; --teal:#2e8188; --wine:#823f4c; --mbp:#967cff; --hl:#efe9ff; --hlink:#8762ff;
  --orange:#ff5126; --banner:#ff6638; --game:#ff6f36; --gamebadge:#d0ff71; --teampass:#a892ff;
  --progress-bg:#78424d;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:#e9e9e9;font-family:Pretendard,"Noto Sans KR",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;-webkit-font-smoothing:antialiased;color:var(--ink2);line-height:1.5;overflow-x:hidden}
button{font:inherit;border:0;background:none;cursor:pointer;color:inherit;padding:0}
a{color:inherit;text-decoration:none}
input,textarea{font:inherit;color:inherit}
ul{list-style:none}
svg{display:block}
.app{position:relative;max-width:430px;margin:0 auto;background:#fff;min-height:100vh;overflow-x:clip}
.hidden{display:none!important}
.logo{font-family:"Playfair Display",Georgia,"Times New Roman",serif;font-size:30px;line-height:28px;letter-spacing:-.6px;font-weight:500;white-space:nowrap}
.ico{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ico.f{fill:currentColor;stroke:none}
.thumb{position:relative;overflow:hidden;background:var(--rb0)}
.thumb .ph{position:absolute;inset:0;background:var(--ph,#ddd)}
.thumb .ph::after{content:"";position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.18),rgba(0,0,0,.18))}
.thumb .ph i{position:absolute;right:-12%;bottom:-18%;width:70%;height:70%;border-radius:50%;background:rgba(255,255,255,.22)}
.thumb .ph b{position:absolute;left:10px;bottom:8px;font:600 11px/1.2 Pretendard,sans-serif;color:rgba(255,255,255,.85);letter-spacing:.2px}
.bm{position:absolute;left:0;top:0;width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:#fff;filter:drop-shadow(0 1px 2px rgba(0,0,0,.35))}
.bm .ico{width:24px;height:24px}
.bm.on .ico{fill:#fff}
.ed{font-weight:700}
.ed.K{color:var(--K)}.ed.B{color:var(--B)}.ed.C{color:var(--C)}.ed.L{color:var(--L)}.ed.N{color:var(--N)}
.ribbon{position:absolute;left:0;right:0;bottom:0;height:26px;display:flex;align-items:center;justify-content:center;font:600 12px/18px Pretendard,sans-serif;color:var(--ink)}
.ribbon.n{background:var(--N)}.ribbon.b{background:var(--B)}
.star{width:18px;height:18px;fill:#ffb800;stroke:none}
.rate{display:flex;align-items:center;gap:2px;font-size:14px}
.rate b{font-weight:600;color:var(--ink)}
.rate span{color:var(--rb5)}
.clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.clamp3{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.hscroll{display:flex;gap:20px;overflow-x:auto;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.hscroll>*{scroll-snap-align:start;flex:0 0 auto}

/* ── 상단 배너 + 헤더 ── */
.topbanner{display:flex;align-items:center;justify-content:space-between;height:40px;padding:8px 20px;background:var(--teampass);color:#000}
.topbanner p{font-size:18px;font-weight:700;line-height:26px}
.topbanner .ico{width:16px;height:16px;stroke-width:2}
.hdr{position:sticky;top:0;z-index:30;height:60px;display:flex;align-items:center;justify-content:space-between;padding-right:24px;background:var(--hdr,#282828);color:#fff}
.hdr.color{color:var(--ink)}
.hdr .lg{padding:0 20px;display:flex;align-items:center;height:60px}
.hdr .r{display:flex;align-items:center;gap:20px}
.hdr .ib{width:32px;height:32px;display:flex;align-items:center;justify-content:center}
.hdr .ib .ico{width:28px;height:28px;stroke-width:1.7}
.hdr .allnotes{height:36px;padding:8px 12px;border-radius:4px;background:#444;color:#fff;font-size:14px;font-weight:600;line-height:20px;white-space:nowrap}

/* 노트 상세: 헤더/툴바 교체 + 진행바 */
.notebar{position:sticky;top:0;z-index:30;background:var(--rb)}
.notebar .layer{position:relative;height:60px}
.notebar .hdr,.notebar .tools{position:absolute;inset:0;transition:opacity .18s}
.notebar .hdr{position:absolute}
.notebar .tools{display:flex;align-items:center;padding:0 16px;gap:16px;color:rgba(255,255,255,.7)}
.notebar .tools .tb{position:relative;width:32px;height:32px;display:flex;align-items:center;justify-content:center}
.notebar .tools .tb .ico{width:26px;height:26px;stroke-width:1.6}
.notebar .tools .tb.on{color:#fff}.notebar .tools .tb.on .ico{fill:#fff}
.notebar .tools .tb .dot{position:absolute;top:2px;right:2px;width:6px;height:6px;border-radius:50%;background:var(--orange)}
.notebar .tools .set{margin-left:auto;color:var(--purple)}
.notebar .tools .set .ico{width:28px;height:28px}
.notebar:not(.up) .hdr{opacity:0;visibility:hidden}
.notebar.up .tools{opacity:0;visibility:hidden}
.notebar .prog{height:6px;background:var(--progress-bg)}
.notebar .prog i{display:block;height:100%;width:0;background:var(--hlink);transition:width .12s}

/* ── 드로어 ── */
.ov{position:fixed;inset:0;z-index:100;display:none}
.ov.show{display:block}
.ov .dim{position:absolute;inset:0;background:rgba(0,0,0,.5)}
.drawer{position:absolute;top:0;right:0;bottom:0;width:80%;max-width:320px;background:var(--rb);display:flex;flex-direction:column;overflow-y:auto;transform:translateX(100%);transition:transform .22s ease-out;color:var(--ink)}
.ov.show .drawer{transform:none}
.drawer .x{position:absolute;top:12px;right:16px;width:32px;height:32px;display:flex;align-items:center;justify-content:center;color:#fff}
.drawer .x .ico{width:28px;height:28px;stroke-width:2}
.drawer .acct{height:150px;padding:56px 20px 0;color:#fff}
.drawer .chip{display:inline-flex;align-items:center;gap:4px;height:28px;padding:4px 12px;border-radius:1000px;background:#444;font-size:14px;line-height:20px}
.drawer .chip b{color:var(--banner);font-weight:600}.drawer .chip span{color:var(--rb2);font-weight:500}
.drawer .nm{margin-top:8px;font-size:16px;line-height:22px}.drawer .nm b{font-weight:700}
.drawer .em{font-size:14px;line-height:20px;color:var(--rb5);margin-top:2px}
.drawer .blk{padding:10px 0}
.drawer .blk a{display:flex;align-items:center;gap:6px;height:40px;padding:8px 20px;font-size:18px;font-weight:500;line-height:24px;color:var(--ink)}
.drawer .blk.k{background:var(--K)}.drawer .blk.p{background:var(--purple);position:relative}.drawer .blk.t{background:var(--teal)}.drawer .blk.w{background:var(--wine)}
.drawer .gamebadge{display:inline-flex;align-items:center;height:20px;padding:2px 6px;border-radius:999px;background:var(--gamebadge);font-size:12px;font-weight:600;line-height:18px}
.drawer .tip{position:absolute;left:24px;top:-22px;display:flex;align-items:center;gap:8px;height:32px;padding:6px 10px 6px 12px;border-radius:4px;background:var(--rb2);font-size:14px;font-weight:500;line-height:20px;color:var(--ink);box-shadow:0 2px 6px rgba(0,0,0,.15);z-index:2}
.drawer .tip::after{content:"";position:absolute;left:18px;bottom:-6px;border:6px solid transparent;border-top-color:var(--rb2);border-bottom:0}
.drawer .tip .ico{width:16px;height:16px}
.drawer .dfoot{padding:12px 0 0}
.drawer .dfoot a{display:flex;align-items:center;height:28px;padding:0 20px;font-size:14px;font-weight:500;color:var(--rb4)}
.drawer .about{margin-top:12px;position:relative;height:92px;padding:20px 24px;background:#121212;color:#fff;display:flex;align-items:center;justify-content:space-between}
.drawer .about p{font-size:20px;font-weight:600;line-height:26px}.drawer .about p b{color:var(--L);font-weight:600}
.drawer .about .img{width:107px;height:73px;border-radius:4px;background:linear-gradient(135deg,#2b2b2b,#555);filter:brightness(.8)}
.drawer .about .ico{width:28px;height:28px;stroke-width:1.6}
.drawer .logout{margin-top:auto;display:flex;align-items:center;gap:4px;padding:14px 20px;border-top:.5px solid rgba(255,255,255,.2);font-size:14px;font-weight:500;color:var(--rb5)}
.drawer .logout .ico{width:20px;height:20px}

/* ── 홈 ── */
.hero{display:block;background:var(--rb);color:#f5f5f5}
.hero .img{position:relative;height:267px;overflow:hidden;background:linear-gradient(160deg,#d9cdb8 0%,#c9b7a0 35%,#8d9a95 36%,#4e6b60 62%,#c3775f 63%,#9a3f2e 100%)}
.hero .img .sun{position:absolute;right:62px;top:70px;width:96px;height:96px;border-radius:50%;background:#e2603e}
.hero .img .mark{position:absolute;left:20px;top:16px;font:900 34px/1 Pretendard,sans-serif;color:#2d2516;letter-spacing:-1px}

a90n8727c","noteId":1183,"quote":"무슨 말을 할지 고민하기 전에, 상대가 ‘무엇에 수고하는지부터 살펴보라’고요.","ts":"2026-10-27T06:26:00","skin":"gray","memo":""},{"id":"H1793049915707leu34pvv7fn","noteId":1183,"quote":"논쟁은 이길 수 없다. 논쟁에서 지면 진 것이고, 이긴다고 해도 진 것이다. 왜냐고? 글쎄, 다른 사람에게 승리를 거두고, 그의 주장에 구멍을 숭숭 뚫어 놓고, 그가 제정신이 아니라는 걸 증명한다고 하자. 그래서 어쩌겠다는 건가? 기분이 좋을 수는 있겠다. 하지만 상대방은 어떤가? 당신은 상대방이 열등감을 느끼게 만들었다. 그의 자존심에 상처를 주었다","ts":"2026-10-27T06:25:00","skin":"gray","memo":""},{"id":"H1793049811255cgn60w28rj5","noteId":1183,"quote":"당신과 이야기 나누고 있는 사람은 당신과 당신의 문제보다는 자신과 자신의 욕구, 자신의 문제에 백 배는 더 관심이 있다는 사실을 기억하라","ts":"2026-10-27T06:23:00","skin":"gray","memo":""},{"id":"H1792558684911n87kz5sagyr","noteId":2165,"quote":"어쨌든 소설의 등장인물에 대해 나는 배워야 할 것들이 아직 많습니다. 그와 동시에 내 소설의 등장인물에게서 내가 배워야 할 것들도 아직 많습니다. 앞으로도 온갖 이상하고 신기하고 또한 컬러풀한 캐릭터를 소설 속에 등장시켜 숨 쉬게 해주고 싶습니다.새 소설을 쓰기 시작할 때, 나는 항상 가슴이 두근두근 설렙니다. 이번에는 또 어떤 인물들을 만날까, 하고.","ts":"2026-10-21T13:58:00","skin":"gray","memo":""},{"id":"H1792558549911i14m0yp5r49","noteId":2165,"quote":"장기적인 일을 할 때는 규칙성이 중요한 의미","ts":"2026-10-21T13:55:00","skin":"gray","memo":""},{"id":"H1792558529404mgxxxh0alnr","noteId":2165,"quote":"무라카미에게 그 힘을 만들어주는 건, ‘루틴을 지키는 일’이었어요. 그는 매일 새벽에 일어나 커피를 내리고, 하루의 가장 첫 순서로 글쓰기를 하죠. 5시간가량 몰입해 글을 씁니다.","ts":"2026-10-21T13:55:00","skin":"gray","memo":""},{"id":"H1792558517173egeq54eyb5v","noteId":2165,"quote":"그렇게 묵묵히 계속하다 보면 어느 순간 내 안에서 ‘뭔가’가 일어납니다. 하지만 그것이 일어나기까지는 어느 정도 시간이 걸립니다. 당신은 그것을 참을성 있게 기다려야만 합니다. 하루는 어디까지나 하루씩입니다. 한꺼번에 몰아 이틀 사흘씩 해치울 수는 없습니다.","ts":"2026-10-21T13:55:00","skin":"gray","memo":""},{"id":"H1792539878645hbwttp6ds8","noteId":2165,"quote":"그래서 ‘아, 난감하네. 이쪽이 더 잘 썼으면 어쩌지?’라고 내심 걱정하면서 읽어봤는데, 결론부터 말하자면 나중에 다시 쓴 버전이 명백히 뛰어났습니다.여기서 내가 말하고 싶은 것은 어떤 문장이든 반드시 개량의 여지가 있다는 것입니다.","ts":"2026-10-21T08:44:00","skin":"gray","memo":""},{"id":"H1792539703197h0evpvw3m8v","noteId":2165,"quote":"“물론 내 영작 능력이라야 뭐, 뻔하지요. 한정된 수의 단어를 구사해 한정된 수의 구문으로 글을 쓰는 수밖에 없습니다. 문장도 당연히 짧아집니다. (…) 묘사에서 불필요한 군더더기를 깎아내고, 전체를 콤팩트한 형태로 만들어 한정된 용기에 넣는 단계를 거칠 수밖에 없습니다.”_49","ts":"2026-10-21T08:41:00","skin":"gray","memo":""},{"id":"H1791597185105qn8k8r7ih3","noteId":2141,"quote":"비유가 독자의 마음속에 그림을 그린다면, 동사는 그림을 움직이게 합니다.","ts":"2026-10-10T10:54:00","skin":"gray","memo":""},{"id":"H1791596849996j3hi6ur5zfn","noteId":2141,"quote":"우리는 빠르게 하강했다. (여전히 딱딱하다. 속도를 묘사하는 동사를 찾아 부사를 없애자.)","ts":"2026-10-10T10:48:00","skin":"gray","memo":""},{"id":"H1791596663600p53yh9n56t9","noteId":2141,"quote":"수동태는 종종 “명확성의 적이 되고, 최악의 경우 진실을 은폐”_79p하기도 합니다.","ts":"2026-10-10T10:44:00","skin":"gray","memo":""},{"id":"H1791595501169kim93y06se","noteId":2141,"quote":"올바른 동사는 정확하고 정직하며 효율적이다.","ts":"2026-10-10T10:25:00","skin":"gray","memo":""},{"id":"H1790609733899i2jqhjmryvk","noteId":2142,"quote":"“어떤 인간도 자신의 문체나 어조를 타고나지 않아요. 태어날 땐 스스로가 누구인지도 잘 모르죠. 우린 결국 훔치면서 배우는 거예요. 여기서 말하는 ‘훔치기’란 표절이 아닌 실습이에요. 표절이 다른 사람의 작품을 내 것인 양 조작한다면, 실습은 ‘역설계’하는 일이죠. 내가 좋아하는 자동차가 있다면, 그 자동차의 작동 원리를 알고 싶어 부품을 다 뜯고 재조립하는 것처럼요.”","ts":"2026-09-29T00:35:00","skin":"gray","memo":""},{"id":"H1790609234969arbyrww2aen","noteId":2115,"quote":"해부학자였던 요로 다케시 씨는 ‘바보의 벽*’이라는 개념을 들려줬습니다. 다 이해했다고 착각해 버리는 인간의 특성을 꼬집으면서요.","ts":"2026-09-29T00:27:00","skin":"gray","memo":""},{"id":"H1790609204786u807ve7nn9","noteId":2115,"quote":"말이 전혀 통하지 않는 땅에 갔다고 해봅시다. 그곳 사람들이 들판을 달리는 토끼를 가리키며 “가바가이”라고 외칩니다. 과연 무슨 뜻일까요?아마 ‘토끼’일 수도 있지만, ‘들판을 달리는 네발 달린 짐승’이나 ‘동물’을 뜻할 수도 있습니다. 아니면 “저놈 잡아라!”라는 명령일지도 모르죠.","ts":"2026-09-29T00:26:00","skin":"gray","memo":""},{"id":"H1790609163948clj6907j12q","noteId":2115,"quote":"틀릴지 모르는 대담한 가설이 모여 인류 역사를 발전시키곤 했습니다.","ts":"2026-09-29T00:26:00","skin":"gray","memo":""},{"id":"H1790609137636ljyd4ttjqon","noteId":2115,"quote":"문명과 예술, 과학의 역사를 보면 늘 누군가는 ‘틀릴지도 모르는 가설’을 세웠습니다. 그 가설을 바탕으로 생각을 이어간 일이, 새로운 것을 만드는 동력이 됐다고 생각합니다.","ts":"2026-09-29T00:25:00","skin":"gray","memo":""},{"id":"H1790606515193j0mr9u1s26","noteId":2142,"quote":"“스타일만 훔칠 게 아니라 스타일 너머의 생각들을 훔쳐야 한다. 영웅들처럼 보여서는 안 된다. 영웅들처럼 보아야 한다. 영웅들을 카피하는 것의 가장 중요한 목적은 그들의 정신세계를 엿보는 것이다. 그들의 스타일을 카피해 보면 그들이 세상을 바라보는 방식을 배울 수 있다.”_오스틴 클레온 작가,『훔쳐라, 아티스트처럼』, 46p","ts":"2026-09-28T23:42:00","skin":"gray","memo":""},{"id":"H17906064192043r36gzk08wu","noteId":2142,"quote":"독창적이고 싶다고? ‘남의 것’부터 훔쳐라","ts":"2026-09-28T23:41:00","skin":"gray","memo":""},{"id":"H1790492474677sqcisxlbixa","noteId":2115,"quote":"우리 인간에겐 시수를 거듭하며 기어코 오류를 바로잡아 나가는 힘이 있다","ts":"2026-09-27T16:02:00","skin":"gray","memo":""},{"id":"H1790489182632at97swwhvgk","noteId":2115,"quote":"영어로 ‘오렌지색 고양이orange cat’이라 하면, 일본인이 생각하는 오렌지색과는 다르죠. 영어권에선 ‘베이지색’에 가까운 색을 가리켜요. 이처럼 세상을 인식하는 잣대가 다른 겁니다.","ts":"2026-09-27T15:06:00","skin":"gray","memo":""},{"id":"H1790409878287a6jhd25wuer","noteId":2109,"quote":"나를 향한 기대를 스스로 품는 것","ts":"2026-09-26T17:06:00","skin":"gray","memo":""},{"id":"H1790408630435sb6tkputglb","noteId":2129,"quote":"‘해보니까 좋은데?’라는 마음을 가질 때까지 보상을 반복","ts":"2026-09-26T16:44:00","skin":"gray","memo":""},{"id":"H17890945654327ry0fetrt1m","noteId":2127,"quote":"마틴은 평범한 하루를 찍었습니다. 시간이 지나면 저절로 특별해질 거라 믿었거든요.","ts":"2026-09-11T11:42:00","skin":"gray","memo":""},{"id":"H1789094418207p3uul7y3qia","noteId":2127,"quote":"유머가 작품으로 들어가는 진입로 같은 거예요. 그렇게 들어가고 나면 그 안에 있는 중산층도, 계급도 보이기 시작하는 거죠.","ts":"2026-09-11T11:40:00","skin":"gray","memo":""},{"id":"H1787747521760x5mmp8fxkss","noteId":2118,"quote":"누구와 있을 것인가. 어디에 있을 것인가. 그리고 무엇을 할 것인가.","ts":"2026-08-26T21:32:00","skin":"gray_basic","memo":""},{"id":"H1787747388605ujjbgc6cxrm","noteId":2118,"quote":"인간의 뇌에는 분명한 한계가 있어요. 생각할 수 있는 힘도, 판단에 쓸 수 있는 시간도 한정돼 있죠.","ts":"2026-08-26T21:29:00","skin":"gray_basic","memo":""},{"id":"H17877473234679b6mwojlanf","noteId":2118,"quote":"농구를 해보지도 않고 ‘내가 농구를 잘할까, 좋아할까’를 알 수 없는 것과 같아요.","ts":"2026-08-26T21:28:00","skin":"gray_basic","memo":""},{"id":"H1787747247847q2cam60ubfc","noteId":2118,"quote":"‘이 회사에 가면 사람들이 부러워하겠지’, ‘이 학교에 가면 부모님이 좋아하시겠지’라는 건 머리로 계산하는 겁니다. 결정한 사람은 나지만, 판단의 기준은 여전히 바깥에 있죠.반대로 ‘이건 정말 해보고 싶다’, ‘생각만 해도 설렌다’, ‘너무 재미있어 보인다’는 감각은 마음에서 오죠. 그런 감각을 따라 결정해야 ‘자기결정’입니다","ts":"2026-08-26T21:27:00","skin":"gray_basic","memo":""},{"id":"H1787282398120ppbq03g5ki","noteId":2089,"quote":"살면서 실패라고 생각한 것들도 실은 내가 최선을 다했던 일이라는 생각이 들었습니다. 중요한 건, 내 삶에 생겨난 일들을 ‘어떤 시선’으로 볼 것인지에 달려 있다.","ts":"2026-08-21T12:20:00","skin":"gray","memo":""},{"id":"H1787281959609xge7yjvm2o","noteId":2089,"quote":"교수님은 이렇게 말씀하셨어요. ‘물병과 종이컵 모두 물을 품는 컨테이너다. 하지만 손걸레도 물을 머금을 수 있다는 점에서, 컨테이너가 될 수 있다’","ts":"2026-08-21T12:12:00","skin":"gray","memo":""},{"id":"H17871579778330l6vkzscdog","noteId":2093,"quote":"어쩌면 좋은 서비스란, ‘물러날 순간을 아는 서비스’가 아닐까요?","ts":"2026-08-20T01:46:00","skin":"gray","memo":""},{"id":"H1785399196281dqkw2cw8bjw","noteId":2066,"quote":"3단계 : ‘WHY’ 선언문 만들기마지막으로 내가 발견한 테마를, ‘기여’와 ‘영향’으로 나눠 한 문장으로 정리합니다.","ts":"2026-07-30T17:13:00","skin":"gray","memo":""},{"id":"H1785399161415y19y1js4tt","noteId":2066,"quote":"각 이야기마다 두 가지를 적어봅니다. ① 내가 어떤 행동을 했는가. ② 그 결과 다른 사람에게 어떤 변화가 일어났는가.","ts":"2026-07-30T17:12:00","skin":"gray","memo":""},{"id":"H1785399138040pdzw35jpqd8","noteId":2066,"quote":"기준선 위엔 다시 돌아가고 싶은 경험을, 선 아래엔 힘들었지만 지금의 나를 만든 경험을 적는 거죠.","ts":"2026-07-30T17:12:00","skin":"gray","memo":""},{"id":"H178539911749391cs12zpdh5","noteId":2066,"quote":"2단계 : 내 삶의 테마 찾기다음은 1단계에서 모은 이야기를 통해, 서로 다른 경험을 관통하는 ‘접점’을 찾아봅니다.","ts":"2026-07-30T17:11:00","skin":"gray","memo":""},{"id":"H1785399069274ehwks1fa2rp","noteId":2066,"quote":"1단계 : 스토리 수집하기먼저 살면서 감정의 진폭이 컸던 사건을 최소 열 개 적습니다.","ts":"2026-07-30T17:11:00","skin":"gray","memo":""},{"id":"H17853990159587ugmcfhta9f","noteId":2066,"quote":"화살이 목표물을 향해 나아가기 위해서는 먼저 그 반대 방향, 즉 180도 뒤로 당겨져야 한다. WHY도 마찬가지다.","ts":"2026-07-30T17:10:00","skin":"gray","memo":""},{"id":"H178460673943462j9sjn34ct","noteId":2057,"quote":"좋아요’와 같은 작은 기능 하나가 사람들이 자료를 고르는 방식을 완전히 바꾼다","ts":"2026-07-21T13:11:00","skin":"gray","memo":""},{"id":"H1784606668067iphdzkgd7qe","noteId":2057,"quote":"불편을 없애면 작업하는 정보와의 관계가 끊어지게 되기 때문입니다. ‘정보에 수동으로 맥락을 부여하는 인간적인 요소’를 없애는 건, 사람이 뭔가를 중요하다고 판단하는 순간을 없애는 것과 같습니다.","ts":"2026-07-21T13:04:00","skin":"gray","memo":""},{"id":"H1784606549953u6htt6wa3cs","noteId":2057,"quote":"취향은 곧 어떤 것을 보고, 플러스와 마이너스를 적는 일이에요. 남기고 지우는 ‘작은 선택’을 계속하는 것이죠. 취향은 결국 ‘주의를 기울이는 일’이니까요.","ts":"2026-07-21T13:02:00","skin":"gray","memo":""},{"id":"H1784606425588y8oqg9605of","noteId":2057,"quote":"누구나 바다·산·사막을 곁에 두진 못해도, 구름은 다들 갖고 있잖아.","ts":"2026-07-21T13:00:00","skin":"gray","memo":""},{"id":"H1784404917445t78sunlz37","noteId":2094,"quote":"사람들이 알고 모르는 것? 그건 상관 없는 것 같아요. 저한테 중요한 건, 어떻게 들릴지 모르겠지만 제 자신이거든요. 제 일에는 제가 가장 엄격하고, 비판적인 시선을 견지해요.","ts":"2026-07-19T05:01:00","skin":"gray","memo":""},{"id":"H1784404864182e7ztz2qxw89","noteId":2094,"quote":"피아노는 기술 연마와는 또 다른, 공부라는 개념이 있다고 생각해요.","ts":"2026-07-19T05:01:00","skin":"gray","memo":""},{"id":"H1784363689761g7bw9xxe3h5","noteId":2055,"quote":".“지금 네가 살고 또 살아온 이 삶을, 너는 다시 한번, 아니 무수히 여러 번 살아야 한다.”_프리드리히 니체, 『즐거운 학문』 341절 「가장 무거운 것」","ts":"2026-07-18T17:34:00","skin":"gray","memo":""},{"id":"H1783918398540bl9yrbbziwh","noteId":2046,"quote":"경비 노동자와 미화 노동자였어요. 그래서 미화 노동자는 ‘말과 글의 뼈대’라는 뜻의 ‘벼리’라고 부르기로 했어요. 우리 아파트의 중심으로 대우하자는 취지였죠. 그렇게 ‘보안관’, ‘동네지기’라는 이름도 나왔고요.","ts":"2026-07-13T13:53:00","skin":"gray","memo":""},{"id":"H17837885941151yrty7d1ldr","noteId":2044,"quote":"삶의 의미 자체에 대한 질문은 사실 그렇게 중요한 문제가 아니다. 우리의 동기와 행복에 훨씬 더 중요한 것은 ‘삶 속에서의 의미’에 대한 질문","ts":"2026-07-12T01:49:00","skin":"gray","memo":""},{"id":"H17837885639711um5yy09q4h","noteId":2044,"quote":"우리는 지금 여기에서 삶의 의미에 대한 명확하고 보편적인 정답을 내놓지는 못할 것이라는 사실 말이다","ts":"2026-07-12T01:49:00","skin":"gray","memo":""},{"id":"H17837486690111g16ci5p7wd","noteId":2044,"quote":"자책감이나 슬픔을 안은 채 잠자리에 들면 그 감정들은 밤사이 더욱 심해질 뿐이다.","ts":"2026-07-11T14:44:00","skin":"gray","memo":""},{"id":"H1783565507606la5it1o16to","noteId":2042,"quote":"코리 교수는 매주 정원의 잔디를 깎을 때마다, 스스로를 ‘잔디 예술가’라고 상상한다고 해요. ‘이번엔 어떤 무늬를 그려볼까?’ 고민하며 마치 그림 그리듯 잔디를 깎는다면서요. 그럼 이 과정 자체가 재밌어진다는 거죠.","ts":"2026-07-09T11:51:00","skin":"gray","memo":""},{"id":"H1783565427357j5v7f5c2az","noteId":2042,"quote":"자신을 있는 그대로 받아들이는 수용acceptance스스로 선택하고 결정하는 자율성autonomy타인과 이어져 있다는 연결감connection무언가를 해낼 수 있다는 역량competence계속 성장하고 있다는 숙달감mastery내가 누군가에게 필요한 존재라는 대인존재감mattering","ts":"20 /* 기분 휠: 위아래 스와이프/휠로도 이동 */

(function () {

/* 스크랩 하이라이트: 본문 텍스트에서 인용문을 찾아 <mark>로 감싼다 */
function applyHighlights() {
  const art = $('#article'); if (!art) return;
  noteScraps(NOTE.id).forEach(s => {
    if (art.querySelector(`mark[data-scrap="${s.id}"]`)) return;
    const walker = document.createTreeWalker(art, NodeFilter.SHOW_TEXT);
    let node; while ((node = walker.nextNode())) {
      if (node.parentElement.closest('mark')) continue;
      const i = node.textContent.indexOf(s.quote); if (i < 0) continue;
      const r = document.createRange(); r.setStart(node, i); r.setEnd(node, i + s.quote.length);

    }
  });
}

function searchNotes(q) {
  const toks = q.toLowerCase().split(/\s+/).filter(Boolean); if (!toks.length) return [];
  const score = n => { const t = (n.title + ' ' + n.author + ' ' + (n.kw || []).join(' ') + ' ' + (n.tags || []).join(' ') + ' ' + (n.summary || '') + ' ' + (n.series || '')).toLowerCase(); let s = 0; toks.forEach(k => { if (n.title.toLowerCase().includes(k)) s += 3; if ((n.kw || []).some(x => x.toLowerCase().includes(k))) s += 2; if (t.includes(k)) s += 1; }); return s; };
  return D.notes.filter(n => !n.upcoming).map(n => [n, score(n)]).filter(x => x[1] > 0).sort((a, b) => b[1] - a[1] || b.id - a.id).map(x => x[0]);
}

}

/* ── 판정 ── */

/* ── 연구자에게 보내기: 구글 설문지(롱블랙 UT 행동 기록 수집)로 제출 → 연결된 구글 시트에 한 줄씩 쌓임 ── */
const FORM = { url: 'https://docs.google.com/forms/d/e/1FAIpQLSfDv5bPr0YvSi8BDQblRed7Kz-vMRGLaU_KKiikbsJ35BOK6w/formResponse',

function version() { const m = location.pathname.match(/\/(v\d+)\b/i); return m ? m[1].toUpperCase() : (location.protocol === 'file:' ? '로컬 파일' : location.pathname); }
